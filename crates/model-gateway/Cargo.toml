[package]
name = "model-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Consent-gated model provider gateway (OpenMindAI Cloud and local OpenAI-compatible endpoints)"

[dependencies]
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service over pure-Rust D-Bus (zbus): persists across reboots and
# needs no system libdbus headers. The kernel keyutils store did not persist.
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
