[package]
name = "codetwin-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
codetwin-core = { path = "../../../crates/codetwin-core" }
project-discovery = { path = "../../../crates/project-discovery" }
qa-execution = { path = "../../../crates/qa-execution" }
web-security-testing = { path = "../../../crates/web-security-testing" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
