[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/codetwin-core",
  "crates/database-analyzer",
  "crates/dataset-benchmark",
  "crates/dependency-audit",
  "crates/lsp-enrichment",
  "crates/project-discovery",
  "crates/qa-analyzer",
  "crates/qa-execution",
  "crates/reference-indexer",
  "crates/runtime-analyzer",
  "crates/secret-scanner",
  "crates/security-analyzer",
  "crates/source-indexer",
  "crates/web-security-testing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
tempfile = "3"
sha2 = "0.10"
url = "2"
regex = "1"
tree-sitter = "0.25.10"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-php = "0.24.2"
tree-sitter-java = "0.23.5"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
