[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/codetwin-core",
  "crates/project-discovery",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
tempfile = "3"
tauri = { version = "2", features = [] }
