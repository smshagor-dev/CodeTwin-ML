[project]
name = "codetwin-ml-sidecar"
version = "0.1.0"
description = "Local CodeTwin ML inference sidecar"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ml = [
  "numpy>=1.26,<2",
  "onnx>=1.17,<2",
  "onnxruntime>=1.19,<2",
  "scikit-learn>=1.5",
  "torch>=2.4",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set so newer Ruff releases cannot change what CI enforces.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true

# Optional ML runtime: may be absent (base CI) or present without type information.
[[tool.mypy.overrides]]
module = ["onnx", "onnx.*", "onnxruntime", "onnxruntime.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_untyped_imports = false
