[project]
name = "codetwin-ml-sidecar"
version = "0.1.0"
description = "Local CodeTwin ML inference sidecar"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ml = [
  "numpy>=1.26,<2",
  "onnx>=1.17,<2",
  "onnxruntime>=1.19,<2",
  "scikit-learn>=1.5",
  "torch>=2.4",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
