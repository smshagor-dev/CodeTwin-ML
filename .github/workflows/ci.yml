name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull-request commits do not need to consume additional CI minutes.
# Preserve main push verification even if another main run is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.0.0
        with:
          go-version-file: services/security-engine/go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build required Tauri Go sidecar
        run: node scripts/build-go-sidecar.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          CODETWIN_TEST_GO_SIDECAR: "1"
      - name: Measured loopback security benchmark
        env:
          CODETWIN_BENCH_REPORT: ${{ runner.temp }}/web-security-benchmark.json
        run: cargo test -p web-security-testing --test local_lab security_readiness_benchmark -- --ignored --nocapture
      - name: Preserve benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-security-benchmark
          path: ${{ runner.temp }}/web-security-benchmark.json
          if-no-files-found: error
      - name: End-to-end smoke (index + every analyzer on this repository)
        run: cargo run --release -p codetwin-core --example e2e_smoke -- .

  windows-qa:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.0.0
        with:
          go-version-file: services/security-engine/go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build required Tauri Go sidecar
        run: node scripts/build-go-sidecar.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p qa-execution -p codetwin-core --all-targets -- -D warnings
      - name: Check Windows Tauri desktop build
        run: cargo check -p codetwin-desktop --locked
      - run: cargo test -p qa-execution -p codetwin-core -- --nocapture
      - name: Windows Go/Rust protocol integration
        env:
          CODETWIN_TEST_GO_SIDECAR: "1"
        run: cargo test -p codetwin-desktop bundled_go_process_roundtrips_review_memory -- --nocapture

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python quality tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.9" "mypy==2.3.1"
      - name: Ruff
        run: python -m ruff check services/ml/codetwin_ml services/ml/tests services/security/codetwin_security services/security/tests scripts/publish_signer_trust_anchor.py scripts/tests/test_publish_signer_trust_anchor.py
      - name: Strict mypy
        env:
          MYPYPATH: services/ml:services/security
        run: python -m mypy services/ml/codetwin_ml services/security/codetwin_security
      - name: Install ONNX smoke runtime
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<2" "onnx>=1.17,<2" "onnxruntime>=1.19,<2"
      - run: python -m unittest discover -s services/ml/tests -v
      - run: python -m unittest discover -s services/security/tests -v
      - run: python -m unittest discover -s scripts/tests -p 'test_publish_signer_trust_anchor.py' -v
      - run: python -m compileall -q services/ml/codetwin_ml services/security/codetwin_security

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node --test fixtures/typescript-basic/tests/*.test.js
      - name: Install loopback browser runtime
        run: npx playwright install --with-deps chromium
      - name: Browser security controls and lazy desktop routes
        run: |
          node scripts/security/verify-xss-contexts.cjs
          node scripts/security/verify-cors-controls.cjs
          node scripts/security/verify-desktop-routes.cjs
          node scripts/security/verify-workspace-overview.cjs
          node scripts/security/verify-finding-workflow.cjs
          node scripts/security/verify-finding-reviews.cjs
          node scripts/security/verify-project-index.cjs
          node scripts/security/verify-git-review.cjs
          node scripts/security/verify-tool-catalog.cjs
          node scripts/security/verify-assessment-jobs.cjs
