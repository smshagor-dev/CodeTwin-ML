name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: End-to-end smoke (index + every analyzer on this repository)
        run: cargo run --release -p codetwin-core --example e2e_smoke -- .

  windows-qa:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p qa-execution -p codetwin-core --all-targets -- -D warnings
      - run: cargo test -p qa-execution -p codetwin-core

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python quality tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.9" "mypy==2.3.1"
      - name: Ruff
        run: python -m ruff check services/ml/codetwin_ml services/ml/tests services/security/codetwin_security services/security/tests
      - name: Strict mypy
        env:
          MYPYPATH: services/ml:services/security
        run: python -m mypy services/ml/codetwin_ml services/security/codetwin_security
      - name: Install ONNX smoke runtime
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<2" "onnx>=1.17,<2" "onnxruntime>=1.19,<2"
      - run: python -m unittest discover -s services/ml/tests -v
      - run: python -m unittest discover -s services/security/tests -v
      - run: python -m compileall -q services/ml/codetwin_ml services/security/codetwin_security

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node --test fixtures/typescript-basic/tests/*.test.js
