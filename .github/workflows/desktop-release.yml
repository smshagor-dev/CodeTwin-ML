name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag (for example v0.1.0)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release after all validation and smoke tests pass"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  RUST_TOOLCHAIN: "1.82.0"
  TAURI_CLI_VERSION: "2.8.4"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require real dependency lockfiles
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock || {
            echo "::error::Cargo.lock is required. Generate it with Cargo from reachable registries or an approved trusted cache; never fabricate it."
            exit 1
          }
          test -s package-lock.json || {
            echo "::error::package-lock.json is required. Generate it with npm from reachable registries or an approved trusted cache; never fabricate it."
            exit 1
          }

      - name: Resolve and validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            PUBLISH=true
          else
            TAG="${{ inputs.release_tag }}"
            PUBLISH="${{ inputs.publish }}"
          fi
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }
          VERSION="${TAG#v}"

          python3 - "${VERSION}" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          expected = sys.argv[1]
          root = pathlib.Path(".")
          package_version = json.loads((root / "package.json").read_text(encoding="utf-8"))["version"]
          tauri_version = json.loads(
              (root / "apps/desktop/src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          )["version"]
          cargo_version = tomllib.loads((root / "Cargo.toml").read_text(encoding="utf-8"))[
              "workspace"
          ]["package"]["version"]
          versions = {
              "package.json": package_version,
              "tauri.conf.json": tauri_version,
              "Cargo.toml": cargo_version,
          }
          mismatched = {name: value for name, value in versions.items() if value != expected}
          if mismatched:
              raise SystemExit(f"release version {expected} does not match manifests: {mismatched}")
          PY

          if [[ "${PUBLISH}" == "true" ]]; then
            git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1 || {
              echo "::error::publishing requires an existing immutable release tag"
              exit 1
            }
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            [[ "${TAG_SHA}" == "${GITHUB_SHA}" ]] || {
              echo "::error::release tag ${TAG} does not point at this workflow commit"
              exit 1
            }
          fi

          echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "publish=${PUBLISH}" >> "${GITHUB_OUTPUT}"

  rust:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  windows-qa:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p qa-execution -p codetwin-core --all-targets --locked -- -D warnings
      - run: cargo test -p qa-execution -p codetwin-core --locked

  python:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python quality tools
        run: python -m pip install --disable-pip-version-check "ruff>=0.8" "mypy>=1.13"
      - name: Ruff
        run: python -m ruff check services/ml/codetwin_ml services/ml/tests services/security/codetwin_security services/security/tests
      - name: Strict mypy
        env:
          MYPYPATH: services/ml:services/security
        run: python -m mypy services/ml/codetwin_ml services/security/codetwin_security
      - name: Install ONNX smoke runtime
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<2" "onnx>=1.17,<2" "onnxruntime>=1.19,<2"
      - run: python -m unittest discover -s services/ml/tests -v
      - run: python -m unittest discover -s services/security/tests -v
      - run: python -m compileall -q services/ml/codetwin_ml services/security/codetwin_security

  frontend:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node --test fixtures/typescript-basic/tests/*.test.js

  windows-release:
    needs: [preflight, rust, windows-qa, python, frontend]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts

      - name: Verify locked Rust dependency graph
        run: cargo fetch --locked

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked

      - name: Import Windows signing certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw "WINDOWS_CERTIFICATE secret is required for production release builds"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD secret is required for production release builds"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "WINDOWS_TIMESTAMP_URL secret is required for production release builds"
          }
          $uri = $null
          if (-not [Uri]::TryCreate($env:WINDOWS_TIMESTAMP_URL, [UriKind]::Absolute, [ref]$uri) -or
              $uri.Scheme -notin @("http", "https")) {
            throw "WINDOWS_TIMESTAMP_URL must be an absolute HTTP(S) timestamp service URL"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "codetwin-release-signing.pfx"
          $base64 = ($env:WINDOWS_CERTIFICATE -replace '-----BEGIN [^-]+-----', '' -replace '-----END [^-]+-----', '' -replace '\s', '')
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($base64))
          }
          catch {
            throw "WINDOWS_CERTIFICATE is not a valid base64-encoded PFX payload"
          }
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -Force $pfxPath
          $certificates = @($certificate)
          if ($certificates.Count -ne 1 -or -not $certificates[0].HasPrivateKey) {
            throw "Windows signing certificate import must yield exactly one certificate with a private key"
          }
          $certificate = $certificates[0]
          if ($certificate.NotAfter -le (Get-Date)) {
            throw "Windows signing certificate is expired"
          }
          "WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate signing-only Tauri config overlay
        shell: pwsh
        run: |
          $config = @{
            bundle = @{
              targets = @("nsis")
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERT_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          }
          $config | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "apps/desktop/src-tauri/tauri.release.generated.conf.json" -Encoding utf8

      - name: Build signed NSIS bundle
        working-directory: apps/desktop
        run: cargo tauri build --ci --bundles nsis --config src-tauri/tauri.release.generated.conf.json

      - name: Ensure release build did not mutate lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock package-lock.json
          test -z "$(git status --porcelain -- Cargo.lock package-lock.json)"

      - name: Locate signed installer
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Generated installer signature is not valid: $($signature.Status)"
          }
          "path=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Clean-machine signed installer smoke
        shell: pwsh
        run: '& scripts/windows_release_smoke.ps1 -InstallerPath "${{ steps.installer.outputs.path }}" -RepositoryRoot "${{ github.workspace }}"'

      - name: Stage release evidence
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath "${{ steps.installer.outputs.path }}" -Destination $out

          cargo metadata --locked --format-version 1 | Set-Content -LiteralPath (Join-Path $out "cargo-metadata.json") -Encoding utf8
          npm ls --all --json | Set-Content -LiteralPath (Join-Path $out "npm-dependencies.json") -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw "npm dependency inventory failed"
          }

          $provenance = [ordered]@{
            schema_version = 1
            product = "CodeTwin ML"
            version = "${{ needs.preflight.outputs.version }}"
            release_tag = "${{ needs.preflight.outputs.release_tag }}"
            source_commit = "${{ github.sha }}"
            workflow = "${{ github.workflow }}"
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_attempt = "${{ github.run_attempt }}"
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            rustc = (rustc --version)
            cargo = (cargo --version)
            node = (node --version)
            npm = (npm --version)
            tauri_cli = (cargo tauri --version)
            optional_dataset_required = $false
          }
          $provenance | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $out "build-provenance.json") -Encoding utf8

          $files = Get-ChildItem -LiteralPath $out -File | Sort-Object Name
          $sumPath = Join-Path $out "SHA256SUMS.txt"
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath $sumPath -Encoding ascii

      - name: Optional GitHub provenance attestation
        if: ${{ vars.ENABLE_GITHUB_ATTESTATION == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: "release-artifacts/*-setup.exe"

      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: codetwin-ml-windows-${{ needs.preflight.outputs.version }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [preflight, windows-release]
    if: ${{ needs.preflight.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: codetwin-ml-windows-${{ needs.preflight.outputs.version }}
          path: release-artifacts

      - name: Verify release checksums
        working-directory: release-artifacts
        run: sha256sum -c SHA256SUMS.txt

      - name: Refuse release overwrite
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ needs.preflight.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "::error::release already exists; production release artifacts are never overwritten"
            exit 1
          fi

      - name: Publish immutable-tag release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ needs.preflight.outputs.release_tag }}" release-artifacts/* --verify-tag --generate-notes --title "CodeTwin ML ${{ needs.preflight.outputs.release_tag }}"
