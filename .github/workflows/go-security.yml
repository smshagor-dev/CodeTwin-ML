name: Go Security Engine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/security-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: services/security-engine/go.mod
      - name: Verify Go formatting
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"
      - name: Test Go security planning
        run: go test -race ./...
      - name: Vet Go code
        run: go vet ./...
      - name: Build offline planner
        run: go build -trimpath -o codetwin-security .

  packaged-companion:
    name: Tauri companion on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: services/security-engine/go.mod
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify sidecar builder
        run: node --check scripts/build-go-sidecar.mjs
      - name: Build packaged Go companion
        run: node scripts/build-go-sidecar.mjs
      - name: Check embedded protocol identity
        run: node -e "const fs=require('fs'),cp=require('child_process'),p=require('path');const d='apps/desktop/src-tauri/binaries';const f=fs.readdirSync(d).find(x=>x.startsWith('codetwin-security-'));if(!f)process.exit(2);const h=JSON.parse(cp.execFileSync(p.resolve(d,f),['--health'],{encoding:'utf8'}));if(h.engine!=='codetwin-security'||h.storage!=='rust-sqlite'||h.protocol_version!==1)process.exit(3)"
