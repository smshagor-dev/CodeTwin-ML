name: Go Security Engine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/security-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6.0.0
        with:
          go-version-file: services/security-engine/go.mod
      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Test Go security planning
        run: go test -race ./...
      - name: Vet Go code
        run: go vet ./...
      - name: Build offline planner
        run: go build -trimpath -o codetwin-security .
