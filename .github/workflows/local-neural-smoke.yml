name: Real Local Neural Embedding Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neural-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install opt-in pretrained neural model runtime
        run: |
          python -m pip install --disable-pip-version-check -r services/ml/requirements-embeddings.txt
      - name: Download and verify pinned public safetensors model
        env:
          MODEL_PATH: ${{ runner.temp }}/codetwin-embedding-model
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          repository = "sentence-transformers/paraphrase-MiniLM-L3-v2"
          revision = "54825a6a5a83f5d98d318ba2a11bfd31eb906f06"
          expected = "cf1e4e2d420c664973037c3c73125d7a8fc69952495093ef8f50596f8943a433"
          root = Path(os.environ["MODEL_PATH"])
          snapshot_download(
              repo_id=repository,
              revision=revision,
              local_dir=str(root),
              allow_patterns=["*.json", "*.txt", "*.safetensors", "1_Pooling/**"],
          )
          weights = root / "model.safetensors"
          with weights.open("rb") as handle:
              digest = hashlib.file_digest(handle, "sha256").hexdigest()
          if digest != expected:
              raise SystemExit("Pinned model weights checksum mismatch")
          if not (root / "modules.json").is_file():
              raise SystemExit("SentenceTransformers module configuration is missing")
          (root.parent / "embedding-provenance.txt").write_text(
              "repository=" + repository + "\nrevision=" + revision +
              "\nweights_sha256=" + digest + "\n", encoding="utf-8"
          )
          print("Pinned model revision and weights SHA-256 validated")
          PY
      - name: Start real offline neural inference server
        env:
          MODEL_PATH: ${{ runner.temp }}/codetwin-embedding-model
        run: |
          set -euo pipefail
          export PYTHONPATH="services/ml"
          python -m codetwin_ml.embedding_api --model-dir "$MODEL_PATH" --port 8765 \
            > "$RUNNER_TEMP/embedding-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/embedding-server.pid"
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8765/health; then
              echo
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/embedding-server.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/embedding-server.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/embedding-server.log"
          exit 1
      - name: Verify local pretrained vector consistency
        env:
          SMOKE_OUTPUT: ${{ runner.temp }}/embedding-evidence.json
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          public_inputs = [
              "The build completed successfully.",
              "The build completed successfully.",
              "The remote review was cancelled.",
          ]
          payload = json.dumps({
              "model": "codetwin-local-embedding",
              "input": public_inputs,
          }).encode("utf-8")
          request = Request(
              "http://127.0.0.1:8765/v1/embeddings",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              result = json.load(response)
          data = result["data"]
          if len(data) != len(public_inputs):
              raise SystemExit("Real model returned unexpected vector count")
          vectors = [item["embedding"] for item in data]
          for vector in vectors:
              if len(vector) != 384:
                  raise SystemExit("Unexpected dimension for pinned model")
              if not all(isinstance(x, (int, float)) and math.isfinite(x) for x in vector):
                  raise SystemExit("Nonfinite model output")
              if abs(sum(x * x for x in vector) - 1.0) > 0.001:
                  raise SystemExit("Model output was not unit normalized")
          if max(abs(a - b) for a, b in zip(vectors[0], vectors[1])) > 0.0001:
              raise SystemExit("Identical public inputs did not produce consistent vectors")
          difference = math.sqrt(sum((a - b) ** 2 for a, b in zip(vectors[0], vectors[2])))
          if difference < 0.001:
              raise SystemExit("Different public inputs generated indistinguishable vectors")
          Path(os.environ["SMOKE_OUTPUT"]).write_text(
              json.dumps({
                  "model": "codetwin-local-embedding",
                  "dimensions": len(vectors[0]),
                  "unit_normalized": True,
                  "identical_input_consistent": True,
                  "distinct_input_distance_observed": True,
              }, indent=2) + "\n", encoding="utf-8"
          )
          print("Real pretrained vector dimensions, norms and consistency verified")
          PY
      - name: Verify pretrained embedding through Rust client
        env:
          CODETWIN_TEST_REAL_EMBEDDINGS: "1"
          CODETWIN_EMBEDDING_ENDPOINT: http://127.0.0.1:8765/v1/embeddings
          CODETWIN_EMBEDDING_MODEL: codetwin-local-embedding
        run: cargo test -p codetwin-core --test native_embedding_provider -- --nocapture
      - name: Preserve non-sensitive pretrained smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-neural-smoke-evidence
          path: |
            ${{ runner.temp }}/embedding-provenance.txt
            ${{ runner.temp }}/embedding-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop local neural service
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/embedding-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/embedding-server.pid")" || true
          fi
