name: Offline Scanner Integration

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Approved Trivy image pinned as repository@sha256:digest (DB downloaded in setup only)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-sandbox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Validate approved pinned image
        env:
          IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE" =~ ^[A-Za-z0-9._:/-]+@sha256:[A-Fa-f0-9]{64}$ ]]; then
            echo "A digest-pinned scanner image is required" >&2
            exit 1
          fi
          echo "CODETWIN_TRIVY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Pull authorized scanner outside the test sandbox
        shell: bash
        run: |
          docker pull "$CODETWIN_TRIVY_IMAGE"
          docker image inspect "$CODETWIN_TRIVY_IMAGE" > /dev/null
      - name: Preload vulnerability database outside the isolated scanner
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$(mktemp -d "$RUNNER_TEMP/codetwin-db-XXXXXXXX")"
          docker run --rm --pull=never \
            --mount "type=bind,src=$CACHE_DIR,dst=/cache" \
            "$CODETWIN_TRIVY_IMAGE" image --download-db-only --cache-dir /cache
          test -s "$CACHE_DIR/db/trivy.db"
          test -s "$CACHE_DIR/db/metadata.json"
          chmod -R a+rX "$CACHE_DIR"
          echo "CODETWIN_TRIVY_DB_DIR=$CACHE_DIR/db" >> "$GITHUB_ENV"
      - name: Enforce and record actual worker Docker launch contract
        shell: bash
        run: |
          set -euo pipefail
          REAL_DOCKER="$(command -v docker)"
          WRAPPER="$RUNNER_TEMP/codetwin-docker-contract"
          cat > "$WRAPPER" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$#" -ge 1 && "$1" == run ]]; then
            network=0
            readonly=0
            no_pull=0
            capdrop=0
            no_privilege=0
            limits=0
            memory=0
            cpu=0
            user=0
            tmpfs=0
            unsafe=0
            project=0
            database=0
            output=0
            rm=0
            previous=""
            for arg in "$@"; do
              if [[ "$previous" == "--network" && "$arg" == none ]]; then network=1; fi
              case "$arg" in
                --read-only) readonly=1 ;;
                --pull=never) no_pull=1 ;;
                --cap-drop=ALL) capdrop=1 ;;
                --security-opt=no-new-privileges) no_privilege=1 ;;
                --pids-limit=64) limits=1 ;;
                --memory=512m) memory=1 ;;
                --cpus=1) cpu=1 ;;
                --user=*) user=1 ;;
                --rm) rm=1 ;;
                --tmpfs=/tmp:rw,noexec,nosuid,size=64m) tmpfs=1 ;;
                --privileged|--cap-add=*|--network=*|--volume|--volume=*|--security-opt=seccomp=unconfined) unsafe=1 ;;
                type=bind,src=*,dst=/workspace,readonly) project=1 ;;
                type=bind,src=*,dst=/tmp/trivy/db,readonly) database=1 ;;
                type=bind,src=*,dst=/out) output=1 ;;
                type=bind,*) unsafe=1 ;;
              esac
              previous="$arg"
            done
            if (( network != 1 || readonly != 1 || no_pull != 1 ||
                  capdrop != 1 || no_privilege != 1 || limits != 1 ||
                  memory != 1 || cpu != 1 || user != 1 || rm != 1 ||
                  tmpfs != 1 || unsafe != 0 ||
                  project != 1 || database != 1 || output != 1 )); then
              echo "Refused scanner launch: missing required isolation option" >&2
              exit 78
            fi
            printf '%s\n' 'offline_worker_runtime_contract=validated' >> "$CODETWIN_SANDBOX_EVIDENCE"
          fi
          exec "$CODETWIN_REAL_DOCKER" "$@"
          SH
          chmod 700 "$WRAPPER"
          echo "CODETWIN_REAL_DOCKER=$REAL_DOCKER" >> "$GITHUB_ENV"
          echo "CODETWIN_DOCKER_PATH=$WRAPPER" >> "$GITHUB_ENV"
          echo "CODETWIN_SANDBOX_EVIDENCE=$RUNNER_TEMP/codetwin-runtime-contract.txt" >> "$GITHUB_ENV"
          # Negative test: unsafe options must be rejected before Docker sees them.
          if CODETWIN_REAL_DOCKER="$REAL_DOCKER" CODETWIN_SANDBOX_EVIDENCE="$RUNNER_TEMP/refused.txt" \
              "$WRAPPER" run --network bridge unsafe-image >/dev/null 2>&1; then
            echo "Unsafe Docker launch was not rejected" >&2
            exit 1
          fi
      - name: Run actual network-disabled container and verify persisted audit
        shell: bash
        env:
          CODETWIN_TEST_REAL_SANDBOX: "1"
        run: |
          cargo test -p codetwin-core --test native_real_sandbox -- --nocapture
          test -s "$CODETWIN_SANDBOX_EVIDENCE"
          grep -Fxq 'offline_worker_runtime_contract=validated' "$CODETWIN_SANDBOX_EVIDENCE"
      - name: Preserve minimal Docker runtime contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-sandbox-runtime-evidence
          path: ${{ runner.temp }}/codetwin-runtime-contract.txt
          if-no-files-found: warn
          retention-days: 7
