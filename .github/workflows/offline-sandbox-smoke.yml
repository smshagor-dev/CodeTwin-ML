name: Offline Scanner Integration

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Approved offline Trivy image with preloaded DB, pinned as repository@sha256:digest"
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-sandbox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate approved pinned image
        env:
          IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE" =~ ^[A-Za-z0-9._:/-]+@sha256:[A-Fa-f0-9]{64}$ ]]; then
            echo "A digest-pinned scanner image is required" >&2
            exit 1
          fi
          echo "CODETWIN_TRIVY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Pull authorized preloaded scanner outside the test sandbox
        shell: bash
        run: |
          docker pull "$CODETWIN_TRIVY_IMAGE"
          docker image inspect "$CODETWIN_TRIVY_IMAGE" > /dev/null
      - name: Run actual network-disabled container and verify persisted audit
        shell: bash
        env:
          CODETWIN_TEST_REAL_SANDBOX: "1"
        run: |
          export CODETWIN_DOCKER_PATH="$(command -v docker)"
          cargo test -p codetwin-core --test native_real_sandbox -- --nocapture
